# Models Apple AUGraphicEQ (aufx/greq/appl) in 31-band mode for AutoEq's fixed band optimizer.
#
# Centres are the audio unit's own parameter frequencies as reported by `auval -v aufx greq appl`,
# not autoeq.constants.PEQ_CONFIGS['31_BAND_GRAPHIC_EQ'], whose 20 * 2**(i/3) spacing drifts from
# them by up to 55 cents (12500 Hz vs 12901.6 Hz).
#
# Filter index must equal the AUGraphicEQ global parameter ID, so this order is load bearing.
optimizer:
  min_f: 20
  max_f: 20000
  min_std: 0.01
filter_defaults:
  type: PEAKING
  q: 4.318473  # one third octave bandwidth
  min_gain: -20.0
  max_gain: 20.0
filters:
  - {fc: 20.0}
  - {fc: 25.0}
  - {fc: 31.5}
  - {fc: 40.0}
  - {fc: 50.0}
  - {fc: 63.0}
  - {fc: 80.0}
  - {fc: 100.0}
  - {fc: 125.0}
  - {fc: 160.0}
  - {fc: 200.0}
  - {fc: 250.0}
  - {fc: 315.0}
  - {fc: 400.0}
  - {fc: 500.0}
  - {fc: 630.0}
  - {fc: 800.0}
  - {fc: 1000.0}
  - {fc: 1250.0}
  - {fc: 1600.0}
  - {fc: 2000.0}
  - {fc: 2500.0}
  - {fc: 3150.0}
  - {fc: 4000.0}
  - {fc: 5000.0}
  - {fc: 6300.0}
  - {fc: 8000.0}
  - {fc: 10000.0}
  - {fc: 12500.0}
  - {fc: 16000.0}
  - {fc: 20000.0}
